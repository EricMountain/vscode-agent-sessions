version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      # @types/vscode must not exceed engines.vscode (vsce rejects it). Bump
      # both together by hand when raising the minimum supported VS Code.
      - dependency-name: '@types/vscode'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
